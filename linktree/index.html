<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Fran Vieira — Especialista em Apliques. Acesse nossos cursos, comunidade e atendimento via WhatsApp." />
  <title>Fran Vieira · Links</title>

  <!-- Brand tokens -->
  <link rel="stylesheet" href="../style-global.css" />

  <!-- Page styles -->
  <link rel="stylesheet" href="./style.css" />

  <!-- AOS -->
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js" defer></script>

</head>

<body>

  <div class="container">

    <!-- ── Profile ─────────────────────────────────────── -->
    <div class="avatar-wrapper" aria-hidden="true">
      <div class="avatar-inner">
        <img src="./fran-avatar.jpg" alt="Foto de Fran Vieira" class="avatar-img" />
      </div>
      <div class="avatar-badge">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 12L11 14L15 10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    </div>

    <h1 class="profile-name">Fran Vieira</h1>
    <p class="profile-tagline">ESPECIALISTA EM APLIQUES</p>
    <p class="profile-bio">Transformando confeitaria em arte estratégica.</p>

    <!-- ── Links ────────────────────────────────────────── -->
    <nav class="links" aria-label="Links principais">

      <!-- WhatsApp -->
      <a id="btn-whatsapp" class="btn-link"
        href="https://wa.me/553498077504?text=Ol%C3%A1%20Fran!%20Vim%20pelo%20site%20e%20gostaria%20de%20fazer%20um%20pedido." target="_blank"
        rel="noopener noreferrer" aria-label="Faça seus pedidos pelo WhatsApp">
        <span class="btn-icon btn-secondary" aria-hidden="true">
          <!-- WhatsApp SVG (sem JS, sem CDN extra) -->
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="#25D366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-13.4 8.38 8.38 0 0 1 3.8.9L21 3z"></path>
          </svg>
        </span>
        <span class="btn-text">Faça seus pedidos pelo WhatsApp</span>
        <span class="btn-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </span>
      </a>

      <!-- Curso Secagem Profissional -->
      <a id="btn-curso" class="btn-link" href="/secagem-profissional" aria-label="Curso Secagem Profissional">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ec88c0" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </span>
        <span class="btn-text">Curso Secagem Profissional</span>
        <span class="btn-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </span>
      </a>

      <!-- Comunidade do Aplique -->
      <a id="btn-comunidade" class="btn-link" href="/comunidade-aplique" aria-label="Comunidade do Aplique">
        <span class="btn-badge">MAIS ACESSADO</span>
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ec88c0" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </span>
        <span class="btn-text">Comunidade do Aplique</span>
        <span class="btn-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </span>
      </a>

    </nav>

    <!-- ── Footer ───────────────────────────────────────── -->
    <footer>
      <p>© <span id="ano-footer"></span> Fran Vieira · Todos os direitos reservados</p>
    </footer>

  </div>


  <!-- Scripts -->
  <script src="../global.js" defer></script>
  <script src="./script.js" defer></script>
</body>

</html>
